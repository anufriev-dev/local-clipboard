<!doctype html>
<html lang="ru">
  <head>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/favicon.ico">
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Домашний буфер обмена</title>
    <link
      rel="stylesheet"
      href="styles.css"
    />
  </head>
  <body>
    <div
      id="updateBanner"
      class="update-banner"
      style="display: none"
    >
    </div>

    <div class="container">
      <h1>📋 Домашний буфер обмена</h1>
      <div
        id="status"
        class="status disconnected"
      >
        Подключение...
      </div>

      <div
        id="qrSection"
        class="qr-section"
      >
        <div class="qr-header">
          <span class="qr-title">📱 Подключить другое устройство</span>
          <button
            id="qrToggle"
            class="qr-toggle"
          >
            Показать QR-код
          </button>
        </div>
        <div
          id="qrContainer"
          class="qr-container collapsed"
        >
          <img
            src="/qr"
            alt="QR-код"
            class="qr-image"
            loading="eager"
          />
          <p class="qr-hint">Отсканируйте этот код для подключения</p>
        </div>
      </div>

      <div
        id="autoClearBar"
        class="auto-clear-bar"
      >
        <div class="auto-clear-left">
          <label
            for="intervalSelect"
            class="auto-clear-label"
            >Автоочистка:</label
          >
          <select
            id="intervalSelect"
            class="auto-clear-select"
          >
            <option value="0">Никогда</option>
            <option value="1">1 минута</option>
            <option value="5">5 минут</option>
            <option
              value="10"
              selected
            >
              10 минут
            </option>
            <option value="30">30 минут</option>
            <option value="60">1 час</option>
            <option value="120">2 часа</option>
          </select>
        </div>
        <div class="auto-clear-right">
          <span
            id="countdownDisplay"
            class="countdown-display"
            style="display: none"
          ></span>
          <button
            id="pauseResumeBtn"
            class="auto-clear-btn pause-resume-btn"
            style="display: none"
            title="Приостановить таймер"
          >
            ⏸
          </button>
          <button
            id="clearNowBtn"
            class="auto-clear-btn clear-now-btn"
            title="Очистить все сообщения сейчас"
          >
            Очистить
          </button>
        </div>
      </div>

      <div
        class="messages"
        id="messages"
      >
        <div class="empty-state">🌱 Поле пустует. Посадите первое сообщение!</div>
      </div>

      <div class="input-area">
        <div class="input-row">
          <textarea
            id="messageInput"
            placeholder="Введите сообщение... (Shift+Enter для новой строки)"
            disabled
            autocomplete="off"
            dir="auto"
            rows="3"
          ></textarea>
          <div class="input-buttons">
            <input
              type="file"
              id="fileInput"
              accept="*/*"
              multiple
              disabled
              style="display: none"
            />
            <label
              for="fileInput"
              id="fileLabel"
              class="icon-btn"
              >📎</label
            >
            <button
              id="sendButton"
              class="icon-btn"
              disabled
            >
              ➤
            </button>
          </div>
        </div>
        <div
          id="fileAttachments"
          class="file-attachments"
          style="display: none"
        ></div>
      </div>
    </div>

    <footer class="footer">
    </footer>

    <script src="script.js"></script>
  </body>
</html>
